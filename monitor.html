<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>価格モニター</title>
  <style>
    /* ① 画面のデザイン（黒背景に大きな緑色の文字） */
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 50px; }
    .price-box { font-size: 72px; font-weight: bold; color: #00ff66; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>435A 現在価格</h2>
  
  <!-- ② 数値を表示するための「空の箱」 -->
  <div id="myPrice" class="price-box">読み込み中...</div>

  <!-- ③ Firebaseと通信するためのツール（ライブラリ）を読み込む -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ④ 送り先（Firebase）の住所を設定
    const firebaseConfig = {
      databaseURL: "https://inav-test-hibi-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    // ⑤ Firebaseの中の「price」というデータを見張る準備
    const dbRef = firebase.database().ref('price');

    // ⑥ データが更新されたら、自動で画面の文字を書き換える
    dbRef.on('value', (snapshot) => {
      const currentVal = snapshot.val();
      document.getElementById('myPrice').innerText = currentVal + " 円";
    });
  </script>

</body>
</html>
