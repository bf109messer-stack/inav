<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>435A フル板＆iNAV Monitor</title>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 8px; }
    .header { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 4px; }
    
    /* 乖離率（サヤ）表示 */
    .diff-box { font-size: 40px; font-weight: bold; margin: 4px 0; border-radius: 6px; padding: 6px 0; background: #1e1e1e; }
    .plus { color: #00ff66; }  /* プラス乖離（緑） */
    .minus { color: #ff3366; } /* マイナス乖離（赤） */
    .neutral { color: #888888; }

    /* iNAV コンパクトテーブル */
    .inav-table { width: 100%; font-size: 13px; border-collapse: collapse; margin-bottom: 6px; }
    .inav-table td { padding: 3px; border-bottom: 1px solid #2a2a2a; }
    .val { text-align: right; font-weight: bold; }

    /* 435A 10本気配板テーブル */
    .board-table { width: 100%; font-size: 13px; border-collapse: collapse; border: 1px solid #444; }
    .board-table th { background-color: #4a148c; color: #fff; padding: 4px; font-size: 11px; font-weight: normal; }
    .board-table td { padding: 2px 4px; border: 1px solid #2c2c2c; text-align: center; height: 18px; }
    
    /* 板の文字・背景色 */
    .ask-price { color: #ff8a80; font-weight: bold; }
    .bid-price { color: #b9f6ca; font-weight: bold; }
    .ask-best { background-color: #d84315; color: #ffffff !important; font-weight: bold; } /* 最良売気配 */
    .bid-best { background-color: #2e7d32; color: #ffffff !important; font-weight: bold; } /* 最良買気配 */
    .ask-qty { color: #ff8a80; text-align: right; font-size: 12px; }
    .bid-qty { color: #b9f6ca; text-align: left; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span style="font-weight:bold; color:#ffd54f;">435A iF日本配当</span>
    <span id="time" style="color:#00ff66;">--:--:--</span>
  </div>

  <!-- 1. 乖離率（最良気配仲値 vs 取引時間中iNAV） -->
  <div id="diff" class="diff-box neutral">0.00%</div>

  <!-- 2. iNAV 情報 (3種類) -->
  <table class="inav-table">
    <tr>
      <td style="text-align:left; color:#888;">取引中iNAV: <span id="inavTrade" class="val" style="color:#4fc3f7;">-</span></td>
      <td style="text-align:center; color:#888;">寄り前: <span id="inavOpen" class="val" style="color:#fff;">-</span></td>
      <td style="text-align:right; color:#888;">間接法: <span id="inavIndirect" class="val" style="color:#aaa;">-</span></td>
    </tr>
  </table>

  <!-- 3. 435A リアルタイム10本気配板 -->
  <table class="board-table">
    <thead>
      <tr>
        <th style="width:32%;">売数量</th>
        <th style="width:36%;">値段</th>
        <th style="width:32%;">買数量</th>
      </tr>
    </thead>
    <tbody id="boardBody">
      <!-- JavaScriptで10本板を自動描画 -->
    </tbody>
  </table>

  <!-- Firebase ライブラリ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ご自身の Firebase URL に書き換えてください
    const firebaseConfig = {
      databaseURL: "https://xxxx-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    const dbRef = firebase.database().ref('data');

    dbRef.on('value', (snapshot) => {
      const d = snapshot.val();
      if (!d) return;

      // 時刻
      document.getElementById('time').innerText = d.time;

      // iNAV 3種
      document.getElementById('inavTrade').innerText = d.inavTrade ? d.inavTrade.toFixed(2) : "-";
      document.getElementById('inavOpen').innerText = d.inavOpen ? d.inavOpen.toFixed(2) : "-";
      document.getElementById('inavIndirect').innerText = d.inavIndirect ? d.inavIndirect.toFixed(2) : "-";

      // 板テーブルの組み立て
      let html = "";

      // ① 成行
      html += `<tr>
        <td class="ask-qty">${d.mktAskQty ? d.mktAskQty.toLocaleString() : "-"}</td>
        <td style="color:#aaa; font-size:11px;">成行</td>
        <td class="bid-qty">${d.mktBidQty ? d.mktBidQty.toLocaleString() : "-"}</td>
      </tr>`;

      // ② 売り気配 10本 (売10 〜 売1)
      if (d.asks) {
        for (let i = 0; i < 10; i++) {
          const price = d.asks[i][0];
          const qty = d.asks[i][1];
          const isBest = (i === 9); // インデックス9（一番下）が最良売気配(売1)
          const priceClass = isBest ? "ask-price ask-best" : "ask-price";
          
          html += `<tr>
            <td class="ask-qty">${qty ? qty.toLocaleString() : ""}</td>
            <td class="${priceClass}">${price ? price.toLocaleString() : ""}</td>
            <td></td>
          </tr>`;
        }
      }

      // ③ 買い気配 10本 (買1 〜 買10)
      if (d.bids) {
        for (let i = 0; i < 10; i++) {
          const price = d.bids[i][0];
          const qty = d.bids[i][1];
          const isBest = (i === 0); // インデックス0（一番上）が最良買気配(買1)
          const priceClass = isBest ? "bid-price bid-best" : "bid-price";
          
          html += `<tr>
            <td></td>
            <td class="${priceClass}">${price ? price.toLocaleString() : ""}</td>
            <td class="bid-qty">${qty ? qty.toLocaleString() : ""}</td>
          </tr>`;
        }
      }

      document.getElementById('boardBody').innerHTML = html;

      // 乖離率の自動計算 (最良売買気配の中央値 vs 取引時間中iNAV)
      if (d.asks && d.bids && d.asks[9][0] > 0 && d.bids[0][0] > 0 && d.inavTrade > 0) {
        const bestAsk = d.asks[9][0]; // 最良売気配
        const bestBid = d.bids[0][0]; // 最良買気配
        const midPrice = (bestAsk + bestBid) / 2;
        const diffVal = ((midPrice - d.inavTrade) / d.inavTrade) * 100;
        
        const diffElem = document.getElementById('diff');
        diffElem.innerText = (diffVal > 0 ? "+" : "") + diffVal.toFixed(2) + "%";

        // 乖離率に応じた色替え（±0.3%以上で発色）
        if (diffVal >= 0.3) {
          diffElem.className = "diff-box plus";
        } else if (diffVal <= -0.3) {
          diffElem.className = "diff-box minus";
        } else {
          diffElem.className = "diff-box neutral";
        }
      }
    });
  </script>
</body>
</html>
