<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>435A フル板＆iNAV Monitor</title>
  <!-- Chart.js 読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 8px; }
    .header { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 4px; }
    
    /* 寄り前iNAV 巨大表示ボックス */
    .inav-open-box { font-size: 36px; font-weight: bold; margin: 4px 0; border-radius: 6px; padding: 4px 0; background: #1e1e1e; color: #ffffff; }
    .inav-open-label { font-size: 12px; color: #888; display: block; margin-bottom: -4px; }

    /* iNAV コンパクトテーブル (取引中、修正値、間接法) */
    .inav-table { width: 100%; font-size: 13px; border-collapse: collapse; margin-bottom: 6px; }
    .inav-table td { padding: 3px; border-bottom: 1px solid #2a2a2a; }
    .val { text-align: right; font-weight: bold; }

    /* チャート用コンテナ */
    .chart-container { background: #1e1e1e; border-radius: 6px; padding: 4px; margin-bottom: 6px; height: 110px; }

    /* 435A 10本気配板テーブル */
    .board-table { width: 100%; font-size: 13px; border-collapse: collapse; border: 1px solid #444; }
    .board-table td { padding: 2px 4px; border: 1px solid #2c2c2c; text-align: center; height: 18px; }
    
    /* 板の文字・背景色 */
    .ask-price { color: #ff8a80; font-weight: bold; }
    .bid-price { color: #b9f6ca; font-weight: bold; }
    .ask-best { background-color: #d84315; color: #ffffff !important; font-weight: bold; } /* 最良売気配 */
    .bid-best { background-color: #2e7d32; color: #ffffff !important; font-weight: bold; } /* 最良買気配 */
    .ask-qty { color: #ff8a80; text-align: right; font-size: 12px; }
    .bid-qty { color: #b9f6ca; text-align: left; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span style="font-weight:bold; color:#ffd54f;">435A iF日本配当</span>
    <span id="time" style="color:#00ff66;">--:--:--</span>
  </div>

  <!-- 1. 寄り前iNAV (巨大表示) -->
  <div class="inav-open-box">
    <span class="inav-open-label">寄り前 iNAV</span>
    <span id="inavOpen">-</span>
  </div>

  <!-- 2. iNAV 情報 (取引中、修正値、間接法) -->
  <table class="inav-table">
    <tr>
      <td style="text-align:left; color:#888;">取引中: <span id="inavTrade" class="val" style="color:#4fc3f7;">-</span></td>
      <td style="text-align:center; color:#888;">修正値: <span id="inavDirectModified" class="val" style="color:#ffcc80;">-</span></td>
      <td style="text-align:right; color:#888;">間接法: <span id="inavIndirect" class="val" style="color:#aaa;">-</span></td>
    </tr>
  </table>

  <!-- 3. 間接法iNAV チャート (300本・9:00前後の色分け対応) -->
  <div class="chart-container">
    <canvas id="indirectChart"></canvas>
  </div>

  <!-- 4. 435A リアルタイム10本気配板 -->
  <table class="board-table">
    <tbody id="boardBody">
      <!-- JavaScriptで板を自動描画 -->
    </tbody>
  </table>

  <!-- Firebase ライブラリ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Chart.js の初期設定
    const ctx = document.getElementById('indirectChart').getContext('2d');
    const indirectChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], 
        datasets: [{
          label: '間接法iNAV',
          data: [],
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.1,
          fill: false,
          segment: {
            borderColor: (ctx) => {
              return indirectHistoryBefore9[ctx.p1DataIndex] ? '#ffb74d' : '#4fc3f7';
            }
          }
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { 
            ticks: { color: '#888', font: { size: 10 } }, 
            grid: { color: '#222' } 
          }
        }
      }
    });

    const indirectHistoryTimes = [];
    const indirectHistoryValues = [];
    const indirectHistoryBefore9 = [];
    const MAX_POINTS = 300;

    const firebaseConfig = {
      databaseURL: "https://inav-test-hibi-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);

    const dbRef = firebase.database().ref('data');

    dbRef.on('value', (snapshot) => {
      const d = snapshot.val();
      if (!d) return;

      document.getElementById('time').innerText = d.time;

      document.getElementById('inavTrade').innerText = d.inavTrade ? d.inavTrade.toFixed(2) : "-";
      document.getElementById('inavDirectModified').innerText = d.inavDirectModified ? d.inavDirectModified.toFixed(2) : "-";
      document.getElementById('inavIndirect').innerText = d.inavIndirect ? d.inavIndirect.toFixed(2) : "-";
      document.getElementById('inavOpen').innerText = d.inavOpen ? d.inavOpen.toFixed(2) : "-";

      if (d.inavIndirect && d.inavIndirect > 0) {
        const timeStr = d.time || '';
        const isBefore9 = timeStr < "09:00:00";

        indirectHistoryTimes.push(timeStr);
        indirectHistoryValues.push(d.inavIndirect);
        indirectHistoryBefore9.push(isBefore9);

        if (indirectHistoryTimes.length > MAX_POINTS) {
          indirectHistoryTimes.shift();
          indirectHistoryValues.shift();
          indirectHistoryBefore9.shift();
        }

        indirectChart.data.labels = indirectHistoryTimes;
        indirectChart.data.datasets[0].data = indirectHistoryValues;
        indirectChart.update('none');
      }

      let html = "";

      // ① 成行
      html += `<tr>
        <td class="ask-qty">${d.mktAskQty ? d.mktAskQty.toLocaleString() : "-"}</td>
        <td style="color:#aaa; font-size:11px;">成行</td>
        <td class="bid-qty">${d.mktBidQty ? d.mktBidQty.toLocaleString() : "-"}</td>
      </tr>`;

      // ② 売り気配 10本 (B11〜B20。インデックス9がB20=最良売気配)
      if (d.asks) {
        for (let i = 0; i < 10; i++) {
          const price = d.asks[i] ? d.asks[i][0] : 0;
          const qty = d.asks[i] ? d.asks[i][1] : 0;
          const isBest = (i === 9); // B20(売1)を最良売気配としてハイライト
          const priceClass = isBest ? "ask-price ask-best" : "ask-price";
          
          html += `<tr>
            <td class="ask-qty">${qty ? qty.toLocaleString() : ""}</td>
            <td class="${priceClass}">${price ? price.toLocaleString() : ""}</td>
            <td></td>
          </tr>`;
        }
      }

      // ③ 買い気配 10本 (B21〜B30。インデックス0がB21=最良買気配)
      if (d.bids) {
        for (let i = 0; i < 10; i++) {
          const price = d.bids[i] ? d.bids[i][0] : 0;
          const qty = d.bids[i] ? d.bids[i][1] : 0;
          const isBest = (i === 0); // B21(買1)を最良買気配としてハイライト
          const priceClass = isBest ? "bid-price bid-best" : "bid-price";
          
          // エクセル側のB21が最良買い気配の場合、左側の列(売数量側)に買数量(qty)が表示される配置に合わせる
          html += `<tr>
            <td></td>
            <td class="${priceClass}">${price ? price.toLocaleString() : ""}</td>
            <td class="bid-qty">${qty ? qty.toLocaleString() : ""}</td>
          </tr>`;
        }
      }

      document.getElementById('boardBody').innerHTML = html;
    });
  </script>
</body>
</html>
